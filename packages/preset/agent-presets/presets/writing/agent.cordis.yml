# The `writing` agent preset: document editing and revision only.
#
# This file is an AGENT-PLANE composition. It contributes only the persona,
# the writing-mode policy section, and the document tools. The documents
# service and UI writing plugin are host-plane rows in the web bundle.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are a writing assistant powered by the {{model}} model. Your working directory is {{cwd}}.
      You help draft, revise, outline, search, and edit documents. Use the document_* tools for all document work.

- id: writing-mode
  name: '@deepseek-ai/dsh-writing-mode'

- id: tool-documents
  name: '@deepseek-ai/dsh-tool-documents'
