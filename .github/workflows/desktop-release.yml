name: Desktop release

# Package the upstream Electron shell (apps/desktop) per target from THIS
# commit's packed dsh family closure, so fork packages ride the runtime, then
# upload the installers to a GitHub Release.
#
# Differences from the upstream scripts this flow drives: the update channel
# is this repository's GitHub Releases instead of the Tencent COS deployment
# (the fork holds no COS credentials; see electron-builder.config.mjs), the
# packaged app version carries the fork serial through DSH_DESKTOP_VERSION,
# and code signing is an unsigned-but-valid fallback when the secrets below
# are absent. macOS notarization and Windows token signing engage only when
# their environments are configured.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Fork version stamped into the installers (e.g. 0.1.5-rc.1-x.0.11); empty uses the dsh manifest version'
        required: false
        default: ''
      release-tag:
        description: 'Existing release tag to upload the installers to (e.g. dsh-v0.1.5-rc.1-x.0.11); empty skips the upload'
        required: false
        default: ''

permissions:
  contents: write

env:
  DSH_TELEMETRY_DISABLED: '1'
  DSH_DESKTOP_APP_ID: com.deepseek.harness
  # writeReleaseRecord resolves the COS update config for its bookkeeping
  # file; the fork never uploads to COS, so a bare origin suffices.
  DOWNLOAD_TEST_ORIGIN: https://github.com
  FORK_VERSION: ${{ github.event.inputs.version }}
  RELEASE_TAG: ${{ github.event.inputs.release-tag }}

jobs:
  windows:
    runs-on: windows-latest
    name: windows x64 / nsis
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install (immutable)
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Download the Electron binary
        shell: pwsh
        # The workspace denies install scripts; the binary the packager needs
        # comes from the Electron package's own installer on demand.
        run: node apps/desktop/node_modules/electron/install.js

      - name: Build the desktop shell
        shell: pwsh
        run: pnpm --filter @deepseek-ai/dsh-desktop run build

      - name: Package win-x64
        shell: pwsh
        env:
          DSH_DESKTOP_VERSION: ${{ env.FORK_VERSION }}
        run: pnpm --filter @deepseek-ai/dsh-desktop exec tsx scripts/package-target.ts win-x64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x64
          path: |
            apps/desktop/.desktop-build/targets/win-x64/artifacts/*.exe
            apps/desktop/.desktop-build/targets/win-x64/artifacts/*.yml
            apps/desktop/.desktop-build/targets/win-x64/artifacts/*.7z
            apps/desktop/.desktop-build/targets/win-x64/artifacts/*.blockmap
          if-no-files-found: error

      - name: Attach installers to the release
        if: ${{ env.RELEASE_TAG != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem apps/desktop/.desktop-build/targets/win-x64/artifacts -Include *.exe, *.yml, *.7z, *.blockmap | ForEach-Object { $_.FullName }
          gh release upload $env:RELEASE_TAG $files --clobber

  macos:
    runs-on: macos-latest
    name: macos arm64 + x64 / dmg
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Download the Electron binary
        # Same opt-in install as the Windows lane.
        run: node apps/desktop/node_modules/electron/install.js

      - name: Build the desktop shell
        run: pnpm --filter @deepseek-ai/dsh-desktop run build

      - name: Package mac-arm64
        env:
          DSH_DESKTOP_VERSION: ${{ env.FORK_VERSION }}
        run: pnpm --filter @deepseek-ai/dsh-desktop exec tsx scripts/package-target.ts mac-arm64

      - name: Package mac-x64
        env:
          DSH_DESKTOP_VERSION: ${{ env.FORK_VERSION }}
        run: pnpm --filter @deepseek-ai/dsh-desktop exec tsx scripts/package-target.ts mac-x64

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: |
            apps/desktop/.desktop-build/targets/mac-arm64/artifacts/*.dmg
            apps/desktop/.desktop-build/targets/mac-arm64/artifacts/*.zip
            apps/desktop/.desktop-build/targets/mac-arm64/artifacts/*.yml
            apps/desktop/.desktop-build/targets/mac-arm64/artifacts/*.blockmap
            apps/desktop/.desktop-build/targets/mac-x64/artifacts/*.dmg
            apps/desktop/.desktop-build/targets/mac-x64/artifacts/*.zip
            apps/desktop/.desktop-build/targets/mac-x64/artifacts/*.yml
            apps/desktop/.desktop-build/targets/mac-x64/artifacts/*.blockmap
          if-no-files-found: error

      - name: Attach installers to the release
        if: ${{ env.RELEASE_TAG != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(
            apps/desktop/.desktop-build/targets/mac-arm64/artifacts/*.{dmg,zip,yml,blockmap}
            apps/desktop/.desktop-build/targets/mac-x64/artifacts/*.{dmg,zip,yml,blockmap}
          )
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
