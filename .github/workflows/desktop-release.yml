name: Desktop release

# Package the upstream Electron shell (apps/desktop) for Windows x64 and
# macOS arm64 from THIS commit's packed dsh family closure, so fork packages
# ride the runtime, then upload the installers to a GitHub Release.
#
# The fork holds no code-signing certificate and no Apple Developer identity,
# and upstream 0.1.6 made both platforms refuse to package without one:
# `validateDesktopPackageEnvironment` requires a real `CSC_LINK` p12 plus a
# notarization strategy before any macOS build starts, and Windows signing needs
# an EV token in a SafeNet key container. This fork relaxes `--unsigned` to
# accept macOS targets so both platforms can ship from one unsigned flow; the
# built artifacts keep the `-unsigned` suffix and land in `unsigned-artifacts`,
# so nothing claims a signature or a notarization that did not happen.
#
# `--unsigned` also drops the update channel: the builder emits no
# `app-update.yml` and no `latest.yml`, which leaves the packaged app's update
# coordinator disabled (`existsSync(app-update.yml)`) rather than pointing it at
# the upstream Tencent COS deployment. Installs are therefore manual — download
# the installer from the Release. Restoring auto-update needs signed builds on
# both platforms, or a fork-owned overlay that publishes a `github` provider.
#
# The macOS app is unsigned, so Gatekeeper blocks first launch: users remove the
# quarantine attribute (`xattr -dr com.apple.quarantine`) or open it from
# Finder's right-click Open.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Fork version stamped into the installer (e.g. 0.1.6-alpha.2-x.0.14); empty uses the dsh manifest version'
        required: false
        default: ''
      release-tag:
        description: 'Existing release tag to upload the installer to (e.g. dsh-v0.1.6-alpha.2-x.0.14); empty skips the upload'
        required: false
        default: ''

permissions:
  contents: write

env:
  DSH_TELEMETRY_DISABLED: '1'
  FORK_VERSION: ${{ github.event.inputs.version }}
  RELEASE_TAG: ${{ github.event.inputs.release-tag }}

jobs:
  windows:
    runs-on: windows-latest
    name: windows x64 / nsis
    timeout-minutes: 120
    steps:
      - name: Allow plain files in place of repository symlinks
        # snapshots/session/office-skills holds two committed symlinks. A Windows
        # runner's git has no symlink privilege, so checkout aborts before any
        # packaging step runs unless the entries land as plain files. macOS
        # keeps real symlinks and needs nothing here.
        shell: pwsh
        run: git config --global core.symlinks false

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Write the release settings
        shell: pwsh
        # Upstream reads every release setting from a gitignored per-platform
        # dotenv and refuses to fall back to the ambient environment, so the
        # fork's values have to be materialized as a file. `production` selects
        # anonymous mandatory-update checks; the `test` deployment would demand a
        # Feishu sign-in before the app may query for updates, and no fork
        # deployment serves that endpoint. A transport failure against the
        # placeholder origin is fail-open, so an unreachable policy origin never
        # blocks startup.
        run: |
          $settings = @'
          DSH_DESKTOP_APP_ID=com.deepseek.harness
          DSH_DESKTOP_AUTO_UPDATE_ENV=production
          DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://github.com
          '@
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD 'apps/desktop/.env.windows'),
            $settings,
            [System.Text.UTF8Encoding]::new($false))

      - name: Install (immutable)
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Download the Electron binary
        shell: pwsh
        # The workspace denies install scripts; the binary the packager needs
        # comes from the Electron package's own installer on demand.
        run: node apps/desktop/node_modules/electron/install.js

      - name: Build the desktop shell
        shell: pwsh
        # The repository build, not the desktop package's own `tsc -b`: a client
        # package resolves a sibling's typert declarations from lib/, which
        # tsdown emits and tsc does not, so a bare desktop build has no types to
        # read on a clean checkout.
        run: pnpm run build

      - name: Package win-x64
        shell: pwsh
        env:
          DSH_DESKTOP_VERSION: ${{ env.FORK_VERSION }}
        # The unsigned target writes to unsigned-artifacts/ instead of
        # artifacts/ and skips the release record, because neither belongs to a
        # build with no signature and no channel.
        run: pnpm --filter @deepseek-ai/dsh-desktop run package:win:x64:unsigned

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x64
          path: |
            apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.exe
          if-no-files-found: error

      - name: Attach installers to the release
        if: ${{ env.RELEASE_TAG != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # -Include needs a wildcard in -Path to take effect; top level only so
          # the win-unpacked helper binaries and builder-debug.yml never reach
          # the release. No channel file and no differential package: an
          # unsigned build has no update feed to compute a differential against.
          $dir = "apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts"
          $installer = Get-ChildItem -Path "$dir/*" -Include *.exe | ForEach-Object { $_.FullName }
          if (-not $installer) { throw "missing installer: $dir/*.exe" }
          gh release upload $env:RELEASE_TAG $installer --clobber

  macos:
    runs-on: macos-14
    name: macOS arm64 / dmg
    timeout-minutes: 90
    steps:
      - name: Allow plain files in place of repository symlinks
        # snapshots/session/office-skills holds two committed symlinks, and the
        # Homebrew git this runner prefers refuses to write them, so checkout
        # aborts before any packaging step runs. Only the packing runtime needs
        # the tree, and it reads these as plain files.
        run: git config --global core.symlinks false

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Write the release settings
        # macOS reads the same three values from a per-platform dotenv; the
        # mandatory-update origin is the placeholder the Windows job uses, and
        # a transport failure against it stays fail-open.
        run: |
          cat > apps/desktop/.env.macos <<'EOF'
          DSH_DESKTOP_APP_ID=com.deepseek.harness
          DSH_DESKTOP_AUTO_UPDATE_ENV=production
          DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://github.com
          EOF

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Download the Electron binary
        # The workspace denies install scripts; the binary the packager needs
        # comes from the Electron package's own installer on demand.
        run: node apps/desktop/node_modules/electron/install.js

      - name: Build the desktop shell
        # The repository build, not the desktop package's own `tsc -b`: a client
        # package resolves a sibling's typert declarations from lib/, which
        # tsdown emits and tsc does not, so a bare desktop build has no types to
        # read on a clean checkout.
        run: pnpm run build

      - name: Package mac-arm64
        env:
          DSH_DESKTOP_VERSION: ${{ env.FORK_VERSION }}
        # No CSC_LINK and no Apple identity: this is the unsigned path the fork
        # added, so the dmg lands in unsigned-artifacts/ without a signature.
        run: pnpm --filter @deepseek-ai/dsh-desktop run package:mac:arm64:unsigned

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-arm64
          path: |
            apps/desktop/.desktop-build/targets/mac-arm64/unsigned-artifacts/*.dmg
          if-no-files-found: error

      - name: Attach the installer to the release
        if: ${{ env.RELEASE_TAG != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Top level only, so the mac-unpacked helper binaries and
          # builder-debug.yml never reach the release.
          shopt -s nullglob
          installers=(apps/desktop/.desktop-build/targets/mac-arm64/unsigned-artifacts/*.dmg)
          if [ ${#installers[@]} -eq 0 ]; then
            echo "missing installer: apps/desktop/.desktop-build/targets/mac-arm64/unsigned-artifacts/*.dmg" >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${installers[@]}" --clobber