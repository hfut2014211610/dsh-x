# electron-builder packaging for the desktop shell (Stage A sidecar shape).
# The bundled dsh runtime under resources/dsh-runtime is assembled by the
# release workflow (npm install @deepseek-ai/dsh@<version> --prefix); a local
# packaging attempt without it fails loud on the missing extraResources path.
appId: com.deepseek.harness
productName: DeepSeek Harness
# The fork's version lives HERE and nowhere else.
#
# Every package manifest in the tree carries upstream's version verbatim, which
# is what keeps an upstream release from conflicting with this fork: a version
# this fork never edits is one git can fast-forward. The last merge produced 227
# conflicts and 221 of them were this one field, in 221 manifests, for no reason
# other than that the fork had renumbered them.
#
# So the fork identity rides the one file upstream will never have. The suffix
# names the upstream release this build is cut from, then the fork's own serial:
# `<upstream version>-x.<fork serial>`. electron-builder merges this into the
# packaged manifest, so it is what `app.getVersion()` reports, what the
# installer filenames carry, and what the update check compares.
extraMetadata:
  version: 0.1.0-rc.8-x.0.6
# Where the in-app update check looks. Without this electron-builder infers the
# target from the package manifest's `repository`, which is UPSTREAM — every
# installed app would then check releases that never carry this fork's builds.
# It also decides where the `latest*.yml` channel file the shell verifies
# downloads against is written; the release workflow uploads it beside the
# installers.
publish:
  provider: github
  owner: hfut2014211610
  repo: dsh-x
directories:
  output: release
  buildResources: build
files:
  - lib/*.js
  - preload.cjs
  - loading.html
  - loading.js
  # The tray reads this out of the asar at runtime; leave it out and the
  # nativeImage is empty, which is the blank-tray failure this entry fixed.
  - assets/tray.png
extraResources:
  # The bundled runtime ships as ONE archive: this electron-builder build
  # strips node_modules from resource copies entirely (a supply-chain rule),
  # so the installed tree cannot ride extraResources directly. The shell
  # extracts this archive into userData on first run (src/bundled-runtime.ts).
  # The release workflow assembles it from `npm install --prefix
  # <stage> @deepseek-ai/dsh@<version>` zipped at its root.
  - from: resources/dsh-runtime.zip
    to: dsh-runtime.zip
win:
  target:
    - nsis
    - portable
  # Signing rides the CSC_LINK / CSC_KEY_PASSWORD environment variables when
  # the release workflow provides them; unsigned builds stay valid fallbacks.
nsis:
  oneClick: true
  perMachine: false
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  category: public.app-category.developer-tools
linux:
  target:
    - AppImage
    - deb
  category: Development
